[package]
name = "ophelia_math"
version = "0.1.0"
edition = "2021"
description = "Deterministic high-performance mathematical kernel for Ophelia"

[lib]
name = "ophelia_math"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
